<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#171923"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2cc60"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6e40c9"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <style>
      .label { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { font-size: 54px; font-weight: 800; letter-spacing: 3px; fill: #f0f6fc; }
      .subtitle { font-size: 18px; fill: #9fb0c7; }
      .small { font-size: 13px; fill: #9fb0c7; }
      .tiny { font-size: 11px; fill: #6b7280; letter-spacing: 1.2px; }
      .card-title { font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .card-text { font-size: 13px; fill: #b7c2d0; }
      .pill { font-size: 11px; font-weight: 700; fill: #0d1117; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="1100" height="430" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1099" height="429" rx="17.5" stroke="#30363d"/>

  <g opacity="0.18">
    <path d="M40 352 C180 300, 235 395, 372 336 S615 282, 740 340 S948 388, 1060 318" stroke="#58a6ff" stroke-width="2"/>
    <path d="M40 316 C180 264, 250 334, 380 290 S620 246, 744 296 S950 328, 1060 276" stroke="#3fb950" stroke-width="2"/>
    <path d="M40 280 C165 225, 278 286, 406 240 S620 206, 760 240 S942 260, 1060 224" stroke="#a78bfa" stroke-width="2"/>
  </g>

  <g transform="translate(56 58)">
    <text class="label title" x="0" y="0" dominant-baseline="hanging">CIRWEL</text>
    <text class="label subtitle" x="2" y="76">runtime governance, continuity, and observability for autonomous agent fleets</text>
    <text class="mono small" x="2" y="116">agents -> check-ins -> calibrated state + verdict -> recovery -> audit trail</text>
  </g>

  <g transform="translate(725 54)">
    <circle cx="110" cy="102" r="82" fill="#0b1220" stroke="#30363d"/>
    <ellipse cx="110" cy="102" rx="122" ry="42" stroke="#30363d" stroke-dasharray="5 7"/>
    <ellipse cx="110" cy="102" rx="42" ry="122" stroke="#30363d" stroke-dasharray="5 7" transform="rotate(55 110 102)"/>
    <ellipse cx="110" cy="102" rx="42" ry="122" stroke="#30363d" stroke-dasharray="5 7" transform="rotate(-55 110 102)"/>
    <line x1="110" y1="36" x2="60" y2="112" stroke="#30363d"/>
    <line x1="110" y1="36" x2="160" y2="112" stroke="#30363d"/>
    <line x1="60" y1="112" x2="110" y2="166" stroke="#30363d"/>
    <line x1="160" y1="112" x2="110" y2="166" stroke="#30363d"/>
    <circle cx="110" cy="36" r="20" fill="url(#green)" filter="url(#shadow)"/>
    <circle cx="60" cy="112" r="20" fill="url(#blue)" filter="url(#shadow)"/>
    <circle cx="160" cy="112" r="20" fill="url(#amber)" filter="url(#shadow)"/>
    <circle cx="110" cy="166" r="20" fill="url(#violet)" filter="url(#shadow)"/>
    <text class="label" x="110" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">E</text>
    <text class="label" x="60" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">I</text>
    <text class="label" x="160" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">S</text>
    <text class="label" x="110" y="172" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">V</text>
    <text class="mono tiny" x="110" y="216" text-anchor="middle">EISV STATE SPACE</text>
  </g>

  <g transform="translate(56 188)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="112" rx="14" fill="#111827" stroke="#30363d"/>
    <rect x="18" y="18" width="74" height="22" rx="11" fill="url(#green)"/>
    <text class="label pill" x="55" y="33" text-anchor="middle">CORE</text>
    <text class="label card-title" x="18" y="64">UNITARES</text>
    <text class="label card-text" x="18" y="87">EISV state, calibration,</text>
    <text class="label card-text" x="18" y="105">verdicts, dialectic, KG</text>
  </g>

  <g transform="translate(314 188)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="112" rx="14" fill="#111827" stroke="#30363d"/>
    <rect x="18" y="18" width="96" height="22" rx="11" fill="url(#amber)"/>
    <text class="label pill" x="66" y="33" text-anchor="middle">RESEARCH</text>
    <text class="label card-title" x="18" y="64">Paper + Benchmarks</text>
    <text class="label card-text" x="18" y="87">class-conditional basins,</text>
    <text class="label card-text" x="18" y="105">EISV-Lumen, datasets</text>
  </g>

  <g transform="translate(572 188)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="112" rx="14" fill="#111827" stroke="#30363d"/>
    <rect x="18" y="18" width="88" height="22" rx="11" fill="url(#violet)"/>
    <text class="label pill" x="62" y="33" text-anchor="middle">SUBSTRATE</text>
    <text class="label card-title" x="18" y="64">Lumen</text>
    <text class="label card-text" x="18" y="87">Raspberry Pi body, sensors,</text>
    <text class="label card-text" x="18" y="105">display, drawings, memory</text>
  </g>

  <g transform="translate(830 188)" filter="url(#shadow)">
    <rect x="0" y="0" width="214" height="112" rx="14" fill="#111827" stroke="#30363d"/>
    <rect x="18" y="18" width="90" height="22" rx="11" fill="url(#blue)"/>
    <text class="label pill" x="63" y="33" text-anchor="middle">ADAPTERS</text>
    <text class="label card-title" x="18" y="64">Hosts + Ops</text>
    <text class="label card-text" x="18" y="87">MCP plugins, Hermes,</text>
    <text class="label card-text" x="18" y="105">Discord bridge, dashboard</text>
  </g>

  <g transform="translate(94 336)">
    <rect x="0" y="0" width="150" height="42" rx="21" fill="#0b1220" stroke="#30363d"/>
    <rect x="214" y="0" width="150" height="42" rx="21" fill="#0b1220" stroke="#30363d"/>
    <rect x="428" y="0" width="150" height="42" rx="21" fill="#0b1220" stroke="#30363d"/>
    <rect x="642" y="0" width="150" height="42" rx="21" fill="#0b1220" stroke="#30363d"/>
    <rect x="856" y="0" width="96" height="42" rx="21" fill="#0b1220" stroke="#30363d"/>
    <path d="M158 21 H204" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M372 21 H418" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M586 21 H632" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M800 21 H846" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="label small" x="75" y="27" text-anchor="middle">Agent fleets</text>
    <text class="label small" x="289" y="27" text-anchor="middle">Check-ins</text>
    <text class="label small" x="503" y="27" text-anchor="middle">State + verdict</text>
    <text class="label small" x="717" y="27" text-anchor="middle">Recovery</text>
    <text class="label small" x="904" y="27" text-anchor="middle">Audit</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
