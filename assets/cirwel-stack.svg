<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="62%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#151923"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2cc60"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6e40c9"/>
    </linearGradient>
    <style>
      .label { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { font-size: 72px; font-weight: 850; fill: #f0f6fc; }
      .subtitle { font-size: 23px; fill: #c6d3e4; }
      .pill { font-size: 13px; font-weight: 800; fill: #0d1117; }
      .card-title { font-size: 27px; font-weight: 850; fill: #f0f6fc; }
      .card-sub { font-size: 17px; fill: #b8c6d8; }
      .step { font-size: 16px; font-weight: 650; fill: #c6d3e4; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="17.5" stroke="#30363d"/>

  <g opacity="0.18" stroke-width="3">
    <path d="M48 286 C210 244, 340 302, 506 258 S828 226, 1152 282" stroke="#3fb950"/>
    <path d="M48 318 C212 270, 346 338, 512 290 S836 258, 1152 318" stroke="#58a6ff"/>
  </g>

  <g transform="translate(60 48)">
    <text class="label title" x="0" y="0" dominant-baseline="hanging">CIRWEL</text>
    <text class="label subtitle" x="2" y="94">Runtime governance, continuity, and observability for autonomous agents</text>
  </g>

  <g transform="translate(865 14)">
    <circle cx="126" cy="82" r="64" fill="#0b1220" stroke="#30363d" stroke-width="2"/>
    <line x1="126" y1="32" x2="82" y2="96" stroke="#3d4655" stroke-width="3"/>
    <line x1="126" y1="32" x2="170" y2="96" stroke="#3d4655" stroke-width="3"/>
    <line x1="82" y1="96" x2="126" y2="140" stroke="#3d4655" stroke-width="3"/>
    <line x1="170" y1="96" x2="126" y2="140" stroke="#3d4655" stroke-width="3"/>
    <circle cx="126" cy="32" r="22" fill="url(#green)"/>
    <circle cx="82" cy="96" r="22" fill="url(#blue)"/>
    <circle cx="170" cy="96" r="22" fill="url(#amber)"/>
    <circle cx="126" cy="140" r="22" fill="url(#violet)"/>
    <text class="label" x="126" y="40" text-anchor="middle" font-size="17" font-weight="850" fill="#ffffff">E</text>
    <text class="label" x="82" y="104" text-anchor="middle" font-size="17" font-weight="850" fill="#ffffff">I</text>
    <text class="label" x="170" y="104" text-anchor="middle" font-size="17" font-weight="850" fill="#ffffff">S</text>
    <text class="label" x="126" y="148" text-anchor="middle" font-size="17" font-weight="850" fill="#ffffff">V</text>
  </g>

  <g transform="translate(60 176)">
    <rect x="0" y="0" width="252" height="92" rx="12" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
    <rect x="18" y="16" width="78" height="24" rx="12" fill="url(#green)"/>
    <text class="label pill" x="57" y="32" text-anchor="middle">CORE</text>
    <text class="label card-title" x="18" y="64">UNITARES</text>
    <text class="label card-sub" x="18" y="84">EISV + verdicts</text>
  </g>

  <g transform="translate(332 176)">
    <rect x="0" y="0" width="252" height="92" rx="12" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
    <rect x="18" y="16" width="104" height="24" rx="12" fill="url(#amber)"/>
    <text class="label pill" x="70" y="32" text-anchor="middle">RESEARCH</text>
    <text class="label card-title" x="18" y="64">Paper v6</text>
    <text class="label card-sub" x="18" y="84">Basins + benchmarks</text>
  </g>

  <g transform="translate(604 176)">
    <rect x="0" y="0" width="252" height="92" rx="12" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
    <rect x="18" y="16" width="112" height="24" rx="12" fill="url(#violet)"/>
    <text class="label pill" x="74" y="32" text-anchor="middle">CONTINUITY</text>
    <text class="label card-title" x="18" y="64">Lumen</text>
    <text class="label card-sub" x="18" y="84">Embodied substrate</text>
  </g>

  <g transform="translate(876 176)">
    <rect x="0" y="0" width="264" height="92" rx="12" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
    <rect x="18" y="16" width="100" height="24" rx="12" fill="url(#blue)"/>
    <text class="label pill" x="68" y="32" text-anchor="middle">ADAPTERS</text>
    <text class="label card-title" x="18" y="64">Hosts + Ops</text>
    <text class="label card-sub" x="18" y="84">MCP + Discord</text>
  </g>

  <g transform="translate(96 300)">
    <rect x="0" y="0" width="142" height="38" rx="19" fill="#0b1220" stroke="#30363d" stroke-width="1.5"/>
    <rect x="222" y="0" width="142" height="38" rx="19" fill="#0b1220" stroke="#30363d" stroke-width="1.5"/>
    <rect x="444" y="0" width="142" height="38" rx="19" fill="#0b1220" stroke="#30363d" stroke-width="1.5"/>
    <rect x="666" y="0" width="142" height="38" rx="19" fill="#0b1220" stroke="#30363d" stroke-width="1.5"/>
    <rect x="888" y="0" width="120" height="38" rx="19" fill="#0b1220" stroke="#30363d" stroke-width="1.5"/>
    <path d="M151 19 H208" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M373 19 H430" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M595 19 H652" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M817 19 H874" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text class="label step" x="71" y="25" text-anchor="middle">Agents</text>
    <text class="label step" x="293" y="25" text-anchor="middle">Check-ins</text>
    <text class="label step" x="515" y="25" text-anchor="middle">State</text>
    <text class="label step" x="737" y="25" text-anchor="middle">Recovery</text>
    <text class="label step" x="948" y="25" text-anchor="middle">Audit</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
